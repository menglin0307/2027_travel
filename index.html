<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9f5ef" />
    <meta name="description" content="2027 員工旅遊沖繩行程與報名表單" />
    <title>2027 員工旅遊｜沖繩出發！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="title-row">
        <p class="eyebrow">OKINAWA · COMPANY TRIP 2027</p>
        <h1>2027 <span>員工旅遊</span></h1>
        <p class="title-note">一起出發，收集海島好心情！</p>
      </header>

      <section class="cover-row" aria-label="沖繩員工旅遊活動圖片">
        <img src="cover.jpg" alt="沖繩員工旅遊插畫橫幅，包含海灘、首里城與鯨鯊" />
        <span class="cover-stamp">沖繩<br />三天兩夜</span>
      </section>

      <section class="details-row" aria-label="活動內容與報名表單">
        <article class="schedule-panel">
          <div class="section-heading">
            <span class="section-kicker">TRIP PLAN</span>
            <h2>行程亮點</h2>
          </div>
          <div class="date-chip"><span aria-hidden="true">✦</span> 2027.1.1</div>
          <ol class="itinerary">
            <li><time>09:00</time><span>台中機場集合出發</span></li>
            <li><time>11:00</time><span>抵達沖繩</span></li>
            <li><time>12:00</time><span>午餐時間</span></li>
            <li><time>14:00</time><span>商場逛街</span></li>
          </ol>
          <div class="schedule-footer">SUNSHINE, SHOPPING &amp; GOOD COMPANY</div>
        </article>

        <section class="form-panel" aria-labelledby="form-title">
          <div class="section-heading form-heading">
            <span class="section-kicker">SAVE YOUR SEAT</span>
            <h2 id="form-title">我要報名</h2>
          </div>
          <form id="signup-form" target="submit-frame" method="post">
            <label class="field">
              <span>姓名 <b>*</b></span>
              <input name="name" autocomplete="name" placeholder="怎麼稱呼你？" required maxlength="80" />
            </label>
            <label class="field">
              <span>Email <b>*</b></span>
              <input name="email" type="email" autocomplete="email" placeholder="name@example.com" required maxlength="160" />
            </label>
            <div class="field-pair">
              <label class="field">
                <span>單位</span>
                <input name="department" autocomplete="organization" placeholder="例如：行銷部" maxlength="100" />
              </label>
              <label class="field">
                <span>職稱</span>
                <input name="title" autocomplete="organization-title" placeholder="例如：專員" maxlength="100" />
              </label>
            </div>
            <div class="field-pair">
              <label class="field">
                <span>電話 <b>*</b></span>
                <input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="09xx xxx xxx" required maxlength="30" />
              </label>
              <label class="field">
                <span>參加人數</span>
                <input name="participants" type="number" min="1" max="20" value="1" inputmode="numeric" />
              </label>
            </div>
            <label class="honeypot" aria-hidden="true">網站<input name="website" tabindex="-1" autocomplete="off" /></label>
            <button type="submit">送出報名 <span aria-hidden="true">↗</span></button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>
    <iframe name="submit-frame" title="報名送出狀態" class="submit-frame"></iframe>
    <script src="app.js?v=2" defer></script>
  </body>
</html>
